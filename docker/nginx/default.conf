# HTTP -> редирект на HTTPS
server {
    listen 80;
    server_name rnfuelloyality.ru;

    # Оставляем для обновлений Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name rnfuelloyality.ru;

    # Пути к сертификатам Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/rnfuelloyality.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rnfuelloyality.ru/privkey.pem;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 12m;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        access_log off;
    }
}